<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <!-- Definitions & Gradients for Dark Backgrounds -->
  <defs>
    <style>
      .brand-title-white {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 28px;
        letter-spacing: -0.5px;
      }
      .brand-sub-white {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 9px;
        letter-spacing: 1.8px;
      }
    </style>
    
    <!-- Radiant Gold/Amber Dash Ring -->
    <linearGradient id="goldGradientDark" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Warm Ivory/Silk Medallion Background -->
    <radialGradient id="bgGradientDark" cx="28" cy="24" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="70%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </radialGradient>

    <!-- Stylized Lotus Center Petal -->
    <linearGradient id="lotusCenterDark" x1="28" y1="10" x2="28" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Stylized Lotus Petal Left -->
    <linearGradient id="lotusPetalLeftDark" x1="12" y1="19" x2="28" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>

    <!-- Stylized Lotus Petal Right -->
    <linearGradient id="lotusPetalRightDark" x1="44" y1="19" x2="28" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Lotus & Craft Emblem (Crisp, High-Detail, Vibrant) -->
  <g transform="translate(4, 4)">
    <!-- Outer Glow Dotted Halo -->
    <circle cx="28" cy="28" r="26" stroke="url(#goldGradientDark)" stroke-width="2.5" stroke-dasharray="2 3" opacity="0.95"/>
    
    <!-- Medallion Silk Base -->
    <circle cx="28" cy="28" r="23" fill="url(#bgGradientDark)"/>
    
    <!-- Stylized Lotus / Artisan Wings -->
    <path d="M28 10 C24 19 21 28 28 39 C35 28 32 19 28 10 Z" fill="url(#lotusCenterDark)"/>
    <path d="M26 19 C18 23 12 30 18 39 C24 38 27 31 26 19 Z" fill="url(#lotusPetalLeftDark)" opacity="0.95"/>
    <path d="M30 19 C38 23 44 30 38 39 C32 38 29 31 30 19 Z" fill="url(#lotusPetalRightDark)" opacity="0.95"/>
    
    <!-- Base hands / Loom curve -->
    <path d="M15 37 C22 44 34 44 41 37 C37 42 19 42 15 37 Z" fill="#D97706"/>
    
    <!-- Golden Bindi / Artisan Sparkle -->
    <circle cx="28" cy="13" r="2.2" fill="#FEF08A"/>
    <circle cx="28" cy="13" r="1.1" fill="#D97706"/>
  </g>
  
  <!-- HerVana Brand Name (Luminous White & Warm Terracotta) -->
  <text x="68" y="37" class="brand-title-white" fill="#FFFFFF">
    Her<tspan fill="#FF7A50">Vana</tspan>
  </text>
  
  <!-- Subtitle Tagline (Warm Artisan Gold) -->
  <text x="69" y="52" class="brand-sub-white" fill="#FCD34D" text-transform="uppercase">
    WOMEN SHG MARKETPLACE
  </text>
</svg>
