<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Outer Glow and Ring Gradients -->
    <linearGradient id="favRing" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- High-Contrast Warm Disc Background (Visible on both dark and light browser tabs) -->
    <radialGradient id="favBgDisc" cx="32" cy="30" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </radialGradient>

    <!-- Lotus Petal Gradients -->
    <linearGradient id="favLotusCenter" x1="32" y1="12" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="45%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>

    <linearGradient id="favLotusLeft" x1="14" y1="21" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>

    <linearGradient id="favLotusRight" x1="50" y1="21" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>

    <!-- Crisp Drop Shadow for micro-contrast at tiny favicon scales -->
    <filter id="favDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#78350F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. High-Contrast Round Badge (Ensures clear visibility on dark, incognito, and light tabs) -->
  <circle cx="32" cy="32" r="30" fill="url(#favBgDisc)" stroke="url(#favRing)" stroke-width="2.75"/>

  <!-- 2. Artisan Inner Decorative Dotted Ring -->
  <circle cx="32" cy="32" r="26.5" stroke="#F59E0B" stroke-width="1.25" stroke-dasharray="2.5 2.5" opacity="0.8"/>

  <!-- 3. HerVana Lotus & Craft Core Emblem -->
  <g filter="url(#favDropShadow)">
    <!-- Central Flame Petal -->
    <path d="M32 12 C27 22 24 32 32 44 C40 32 37 22 32 12 Z" fill="url(#favLotusCenter)"/>

    <!-- Left Artisan Petal / Wing -->
    <path d="M30 22 C19 26 12 34 20 44 C27 43 31 35 30 22 Z" fill="url(#favLotusLeft)" opacity="0.97"/>

    <!-- Right Artisan Petal / Wing -->
    <path d="M34 22 C45 26 52 34 44 44 C37 43 33 35 34 22 Z" fill="url(#favLotusRight)" opacity="0.97"/>

    <!-- Cupped Hands / Weaver Loom Base -->
    <path d="M17 42 C24 50 40 50 47 42 C43 48 21 48 17 42 Z" fill="#D97706"/>

    <!-- Golden Bindi / Artisan Sparkle Dot -->
    <circle cx="32" cy="15.5" r="2.8" fill="#FDE047" stroke="#D97706" stroke-width="0.8"/>
    <circle cx="32" cy="15.5" r="1.3" fill="#D97706"/>
  </g>
</svg>