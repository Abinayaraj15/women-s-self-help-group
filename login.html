<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Sign Up | HerVana - Women SHG Marketplace</title>
  <meta name="description" content="Sign in or create an account on HerVana. Support India's rural Women Self Help Groups and artisan cooperatives.">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="images/logo-icon.svg">
  <link rel="apple-touch-icon" href="images/logo-icon.svg">
</head>
<body>

  <!-- Top Header with Logo, RTL Toggle, and Theme Toggle -->
  <header class="auth-top-header">
    <div class="container auth-header-container">
      
      <!-- Brand Logo at Top -->
      <a href="index.html" class="brand-logo" title="Back to HerVana Marketplace">
        <img src="images/logo.svg" alt="HerVana Logo" class="logo-light" onerror="this.src='images/logo.png'">
        <img src="images/logo-white.svg" alt="HerVana Logo" class="logo-dark" onerror="this.src='images/logo.png'">
      </a>

      <!-- RTL & Theme Controls at Top -->
      <div class="auth-top-actions">
        <!-- RTL Toggle Button -->
        <button type="button" class="icon-btn rtl-toggle-btn" title="Toggle RTL / LTR Direction" aria-label="Toggle RTL layout direction">
          <svg width="19" height="19" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
        </button>

        <!-- Dark / Light Theme Toggle Button -->
        <button type="button" class="icon-btn theme-toggle-btn" title="Toggle Dark / Light Mode" aria-label="Toggle Dark and Light theme">
          <svg width="19" height="19" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>

        <!-- Direct Link Back to Storefront -->
        <a href="index.html" class="auth-back-link">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          <span>Back to Store</span>
        </a>
      </div>

    </div>
  </header>

  <!-- Main Auth Page Content -->
  <div class="auth-page-wrap">
    <div class="auth-card">
      
      <!-- Sign In vs Sign Up Mode Switcher -->
      <div class="auth-mode-switch">
        <button type="button" class="auth-mode-tab active" id="tabSignIn" onclick="switchAuthMode('signin')">
          Sign In
        </button>
        <button type="button" class="auth-mode-tab" id="tabSignUp" onclick="switchAuthMode('signup')">
          Create Account
        </button>
      </div>

      <!-- Header Title & Subtitle -->
      <div class="auth-header" style="text-align: left; margin-bottom: 1.5rem;">
        <h2 id="authHeading">Welcome Back</h2>
        <p id="authSub">Sign in to support India's rural women craft collectives</p>
      </div>

      <!-- Account Type Segmented Tabs (Buyer vs SHG Leader) -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="roleBtnBuyer" onclick="switchRole('buyer')">
          Patron / Buyer
        </button>
        <button type="button" class="auth-tab-btn" id="roleBtnSeller" onclick="switchRole('seller')">
          SHG Artisan Leader
        </button>
      </div>

      <!-- Live Inline Feedback Banner -->
      <div id="authAlertBanner" style="display: none; padding: 0.85rem 1rem; border-radius: var(--radius-md); margin-bottom: 1.25rem; font-size: 0.88rem; font-weight: 600; text-align: left;"></div>

      <!-- Auth Form (Handles both Login and Sign Up) -->
      <form id="authForm" onsubmit="handleAuthSubmit(event)">
        
        <!-- Full Name (Only visible during Sign Up) -->
        <div class="form-group" id="fullNameGroup" style="display: none;">
          <label class="form-label" id="nameLabel">Full Name *</label>
          <input type="text" id="signupFullName" class="form-control" placeholder="Radha Devi">
        </div>

        <!-- Email or Mobile -->
        <div class="form-group">
          <label class="form-label" id="usernameLabel">Email or Mobile Number *</label>
          <input type="text" id="loginUsername" class="form-control" placeholder="artisan@hervana.org" required>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label">Password *</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <!-- Confirm Password (Only visible during Sign Up) -->
        <div class="form-group" id="confirmPasswordGroup" style="display: none;">
          <label class="form-label">Confirm Password *</label>
          <input type="password" id="signupConfirmPassword" class="form-control" placeholder="••••••••">
        </div>

        <!-- Meta options (Remember Me & Forgot Password) -->
        <div class="form-meta-row" id="rememberForgotRow">
          <label style="display:flex; align-items:center; gap:0.45rem; cursor:pointer; color:var(--text-secondary);">
            <input type="checkbox" checked style="accent-color:var(--primary);">
            <span>Remember me</span>
          </label>
          <a href="#" onclick="showAuthNotice('Password reset link sent to registered email / mobile number.', true); return false;">Forgot password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-block" id="authSubmitBtn">
          Sign In
        </button>

        <!-- Divider -->
        <div class="auth-divider">Or continue with</div>

        <!-- Google & Apple Social Login Buttons at Bottom -->
        <div class="oauth-buttons-wrap">
          <!-- Google Button -->
          <button type="button" class="btn-oauth btn-oauth-google" title="Google Sign-In" onclick="handleOAuthGoogle(event)">
            <svg width="18" height="18" viewBox="0 0 48 48">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span>Google</span>
          </button>

          <!-- Apple Button -->
          <button type="button" class="btn-oauth btn-oauth-apple" title="Apple Sign-In" onclick="handleOAuthApple(event)">
            <svg width="18" height="18" viewBox="0 0 170 170" fill="currentColor">
              <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.04-7.59-7.71-11.66-14.01-6.75-10.43-11.89-21.84-15.42-34.22-3.53-12.38-5.3-24.08-5.3-35.09 0-13.8 3.52-25.26 10.57-34.37 7.05-9.11 15.93-13.78 26.63-14 5.34 0 11.19 1.5 17.55 4.5 6.36 3 10.28 4.54 11.75 4.62 1.34-.14 5.41-1.74 12.22-4.8 6.81-3.06 12.44-4.45 16.89-4.17 12.63.85 22.75 5.64 30.36 14.37-10.99 6.64-16.38 15.64-16.16 26.98.22 8.78 3.65 16.1 10.29 21.96 6.64 5.86 14.49 9.17 23.54 9.94-2.58 7.78-5.91 15.68-10 23.7zM119.22 33.39c-.11-3.41.77-7.1 2.65-11.06 1.88-3.96 4.71-7.61 8.5-10.95 3.79-3.34 7.85-5.69 12.18-7.05 4.33-1.36 8.3-2.02 11.91-1.98.22 3.48-.68 7.21-2.7 11.19-2.02 3.98-4.91 7.6-8.67 10.86-3.76 3.26-7.85 5.56-12.27 6.9-4.42 1.34-8.29 2.04-11.6 2.09z"/>
            </svg>
            <span>Apple</span>
          </button>
        </div>

        <!-- Mode Toggle Switch in Card Footer -->
        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--text-secondary);">
          <span id="footerTogglePrompt">Don't have an account? </span>
          <a href="#" id="footerToggleLink" onclick="toggleAuthMode(); return false;" style="color: var(--primary); font-weight: 700;">
            Create an Account
          </a>
          <div style="margin-top: 0.5rem; font-size: 0.82rem;">
            <span>Are you a registered cooperative? </span>
            <a href="join-us.html" style="color: var(--accent-gold-dark); font-weight: 700;">Register as SHG Group</a>
          </div>
        </div>
      </form>

    </div>
  </div>

  <script src="js/script.js"></script>
  <script>
    let currentMode = 'signin'; // 'signin' or 'signup'
    let currentRole = 'buyer';  // 'buyer' or 'seller'

    function showAuthNotice(message, isSuccess = true) {
      const banner = document.getElementById('authAlertBanner');
      if (!banner) return;
      banner.style.display = 'block';
      banner.style.background = isSuccess ? 'rgba(16, 185, 129, 0.14)' : 'rgba(239, 68, 68, 0.14)';
      banner.style.border = isSuccess ? '1px solid #10B981' : '1px solid #EF4444';
      banner.style.color = isSuccess ? '#047857' : '#DC2626';
      banner.innerHTML = (isSuccess ? '✓ ' : '⚠ ') + message;
    }

    function switchAuthMode(mode) {
      currentMode = mode;
      const tabSignIn = document.getElementById('tabSignIn');
      const tabSignUp = document.getElementById('tabSignUp');
      const heading = document.getElementById('authHeading');
      const sub = document.getElementById('authSub');
      const fullNameGroup = document.getElementById('fullNameGroup');
      const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');
      const rememberForgotRow = document.getElementById('rememberForgotRow');
      const submitBtn = document.getElementById('authSubmitBtn');
      const footerPrompt = document.getElementById('footerTogglePrompt');
      const footerLink = document.getElementById('footerToggleLink');
      const uname = document.getElementById('loginUsername');
      const nameLabel = document.getElementById('nameLabel');
      const banner = document.getElementById('authAlertBanner');
      if (banner) banner.style.display = 'none';

      if (mode === 'signup') {
        tabSignUp.classList.add('active');
        tabSignIn.classList.remove('active');
        if (currentRole === 'seller') {
          heading.textContent = 'Register as SHG Artisan Leader';
          sub.textContent = 'Join HerVana to list handmade inventory, receive direct orders & bank payouts';
          submitBtn.textContent = 'Create SHG Artisan Account';
          if (nameLabel) nameLabel.textContent = 'SHG Leader Full Name *';
          if (uname) uname.placeholder = 'leader@shg-collective.in';
        } else {
          heading.textContent = 'Create Your Patron Account';
          sub.textContent = 'Support India’s rural women craft collectives directly with zero broker cuts';
          submitBtn.textContent = 'Create Free Account';
          if (nameLabel) nameLabel.textContent = 'Full Name *';
          if (uname) uname.placeholder = 'patron@example.com';
        }
        fullNameGroup.style.display = 'block';
        confirmPasswordGroup.style.display = 'block';
        rememberForgotRow.style.display = 'none';
        footerPrompt.textContent = 'Already have an account? ';
        footerLink.textContent = 'Sign In';
      } else {
        tabSignIn.classList.add('active');
        tabSignUp.classList.remove('active');
        if (currentRole === 'seller') {
          heading.textContent = 'SHG Artisan Portal Sign In';
          sub.textContent = 'Access cooperative inventory, orders, and bank payouts';
          submitBtn.textContent = 'Sign In as SHG Leader';
          if (uname) uname.placeholder = 'leader@shg-collective.in';
        } else {
          heading.textContent = 'Welcome Back';
          sub.textContent = 'Sign in to support India’s rural women craft collectives';
          submitBtn.textContent = 'Sign In';
          if (uname) uname.placeholder = 'artisan@hervana.org';
        }
        fullNameGroup.style.display = 'none';
        confirmPasswordGroup.style.display = 'none';
        rememberForgotRow.style.display = 'flex';
        footerPrompt.textContent = "Don't have an account? ";
        footerLink.textContent = 'Create an Account';
      }
    }

    function toggleAuthMode() {
      switchAuthMode(currentMode === 'signin' ? 'signup' : 'signin');
    }

    function switchRole(role) {
      currentRole = role;
      const btnBuyer = document.getElementById('roleBtnBuyer');
      const btnSeller = document.getElementById('roleBtnSeller');

      if (role === 'seller') {
        btnSeller.classList.add('active');
        btnBuyer.classList.remove('active');
      } else {
        btnBuyer.classList.add('active');
        btnSeller.classList.remove('active');
      }

      switchAuthMode(currentMode);
    }

    function handleOAuthGoogle(e) {
      if (e) e.preventDefault();
      const role = currentRole || 'buyer';
      const email = role === 'seller' ? 'radha.devi.shg@gmail.com' : 'patron.artisan@gmail.com';
      const name = role === 'seller' ? 'Radha Devi (SHG Leader)' : 'Google Verified Patron';

      localStorage.setItem('hervana_user', JSON.stringify({
        name: name,
        email: email,
        role: role,
        provider: 'Google',
        isLoggedIn: true
      }));
      localStorage.setItem('hervana_logged_in', 'true');

      try {
        window.open('https://accounts.google.com/signin/v2/identifier', '_blank');
      } catch (err) {}

      showAuthNotice('Google sign-in successful! Directing to ' + (role === 'seller' ? 'SHG Artisan Dashboard...' : 'HerVana Marketplace...'), true);

      setTimeout(() => {
        if (role === 'seller') {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'index.html';
        }
      }, 700);
    }

    function handleOAuthApple(e) {
      if (e) e.preventDefault();
      const role = currentRole || 'buyer';
      const email = role === 'seller' ? 'radha.devi.shg@apple.com' : 'patron.artisan@icloud.com';
      const name = role === 'seller' ? 'Radha Devi (SHG Leader)' : 'Apple Verified Patron';

      localStorage.setItem('hervana_user', JSON.stringify({
        name: name,
        email: email,
        role: role,
        provider: 'Apple',
        isLoggedIn: true
      }));
      localStorage.setItem('hervana_logged_in', 'true');

      try {
        window.open('https://appleid.apple.com/auth/authorize', '_blank');
      } catch (err) {}

      showAuthNotice('Apple ID sign-in successful! Directing to ' + (role === 'seller' ? 'SHG Artisan Dashboard...' : 'HerVana Marketplace...'), true);

      setTimeout(() => {
        if (role === 'seller') {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'index.html';
        }
      }, 700);
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('loginUsername');
      const passwordInput = document.getElementById('loginPassword');
      const fullNameInput = document.getElementById('signupFullName');
      const confirmPasswordInput = document.getElementById('signupConfirmPassword');

      const username = usernameInput ? usernameInput.value.trim() : '';
      const password = passwordInput ? passwordInput.value : '';
      const fullName = fullNameInput ? fullNameInput.value.trim() : '';
      const confirmPassword = confirmPasswordInput ? confirmPasswordInput.value : '';

      if (currentMode === 'signup') {
        if (!fullName) {
          showAuthNotice('Please enter your full name to create an account.', false);
          if (fullNameInput) fullNameInput.focus();
          return;
        }
        if (!username) {
          showAuthNotice('Please enter your email or mobile number.', false);
          if (usernameInput) usernameInput.focus();
          return;
        }
        if (password.length < 6) {
          showAuthNotice('Password must be at least 6 characters long.', false);
          if (passwordInput) passwordInput.focus();
          return;
        }
        if (password !== confirmPassword) {
          showAuthNotice('Passwords do not match. Please verify your confirm password.', false);
          if (confirmPasswordInput) confirmPasswordInput.focus();
          return;
        }

        const user = {
          name: fullName,
          email: username,
          role: currentRole,
          provider: 'Email Registration',
          isLoggedIn: true
        };
        localStorage.setItem('hervana_user', JSON.stringify(user));
        localStorage.setItem('hervana_logged_in', 'true');

        if (currentRole === 'seller') {
          showAuthNotice('🎉 Account created successfully! Welcome Radha Devi. Directing to SHG Artisan Dashboard...', true);
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 650);
        } else {
          showAuthNotice('🎉 Account created successfully! Welcome ' + fullName + '. Directing to HerVana Marketplace...', true);
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 650);
        }
      } else {
        // Sign In mode
        if (!username || !password) {
          showAuthNotice('Please enter your email/mobile and password to sign in.', false);
          return;
        }

        const displayName = currentRole === 'seller' ? 'Radha Devi (SHG Leader)' : (username.split('@')[0] || 'Patron');
        const user = {
          name: displayName,
          email: username,
          role: currentRole,
          provider: 'Email Login',
          isLoggedIn: true
        };
        localStorage.setItem('hervana_user', JSON.stringify(user));
        localStorage.setItem('hervana_logged_in', 'true');

        if (currentRole === 'seller') {
          showAuthNotice('✓ Sign in successful! Welcome back, ' + displayName + '. Directing to dashboard...', true);
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 650);
        } else {
          showAuthNotice('✓ Sign in successful! Welcome back, ' + displayName + '. Directing to store...', true);
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 650);
        }
      }
    }
  </script>
</body>
</html>
